services:
  app:
    build: ./docker/php
    container_name: lgitapp-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    container_name: lgitapp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Base MySQL dédiée aux tests automatisés (jamais la base de dev).
  # Données jetables (tmpfs) ; démarrer avec : docker compose up -d db_test
  db_test:
    image: mysql:8
    container_name: lgitapp-db-test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-lgit_test_root}
      MYSQL_DATABASE: lgit_test
      MYSQL_USER: ${MYSQL_TEST_USER:-lgit_test}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:-lgit_test}
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-3309}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_TEST_ROOT_PASSWORD:-lgit_test_root}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: lgitapp-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8091}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db

  frontend:
    image: node:20
    container_name: lgitapp-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - app

volumes:
  db_data:
