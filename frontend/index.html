<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- UI-M8 : application installable (écran d'accueil), plein écran, barre système aux couleurs de la marque. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b3550" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Logiscool" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Séances, heures et équipe de Logiscool Pays Vert." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Logiscool Pays Vert</title>
    <script>
      // Thème choisi (clair / nuit) appliqué avant le premier affichage pour éviter tout flash ; « auto » = système.
      try {
        var t = localStorage.getItem('lgit_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
